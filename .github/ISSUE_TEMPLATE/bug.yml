name: Bug / Bug report
description: Algo no app não funciona como deveria. / Something in the app is broken.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar. Falha de segurança não vai aqui: veja o SECURITY.md.
        Thanks for reporting. Security issues do not go here: see SECURITY.md.
  - type: textarea
    id: aconteceu
    attributes:
      label: O que aconteceu? / What happened?
      placeholder: 0,1 + 0,2 deu 0,30000000000000004 na calculadora. / 0.1 + 0.2 showed 0.30000000000000004 in the calculator.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava? / What did you expect?
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como repetir / Steps to reproduce
      placeholder: |
        1. Abra o app em roqueos.com.br
        2. ...
  - type: dropdown
    id: onde
    attributes:
      label: Onde você usou? / Where did you use it?
      multiple: true
      options:
        - roqueos.com.br no navegador / in the browser
        - App do RoqueOS no iPhone ou iPad / RoqueOS app on iPhone or iPad
        - App do RoqueOS no Android / RoqueOS app on Android
        - App do RoqueOS no Windows / RoqueOS app on Windows
        - TV
        - Rodando local com yarn dev / Locally with yarn dev
    validations:
      required: true
  - type: input
    id: aparelho
    attributes:
      label: Aparelho e navegador / Device and browser
      placeholder: iPhone 15, Safari / Windows 11, Chrome
    validations:
      required: true
  - type: input
    id: idioma
    attributes:
      label: Idioma do RoqueOS / RoqueOS language
      placeholder: pt-BR
  - type: textarea
    id: extra
    attributes:
      label: Print, vídeo ou erro do console / Screenshot, video or console error
      description: Arraste o arquivo para cá. / Drag the file here.
